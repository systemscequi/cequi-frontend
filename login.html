<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEQUI - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/theme-light.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .login-page {
            width: 100%;
            max-width: 420px;
            animation: fadeUp 0.45s ease;
        }

        @media (max-width: 720px) {
            .login-page { grid-template-columns: 1fr; }
        }

        /* ── Painel esquerdo: formulário ── */
        .login-form-panel {
            background: var(--bg-mid);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            display: flex;
            flex-direction: column;
        }

        .login-logo-area {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-logo-area img {
            height: 100px;
            width: 100px;
            object-fit: contain;
            display: block;
            margin: 0 auto 0.75rem;
            border-radius: 0;
            background: transparent;
        }
        .login-logo-area .system-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 2px;
            font-family: var(--code-font);
        }
        .login-logo-area .system-sub {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-top: 0.1rem;
        }

        .login-form-panel .form-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        .login-submit {
            width: 100%;
            padding: 0.9rem;
            margin-top: 0.5rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            font-family: var(--body-font);
        }
        .login-submit:hover:not(:disabled) {
            background: var(--primary-light);
            transform: translateY(-1px);
        }
        .login-submit:disabled { opacity: 0.65; cursor: not-allowed; }

        .login-error {
            display: none;
            margin-top: 1rem;
            padding: 0.75rem 1rem;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            border-radius: 8px;
            color: var(--danger);
            font-size: 0.85rem;
            gap: 0.5rem;
            align-items: center;
        }

        .login-hint {
            margin-top: 1.5rem;
            padding: 0.75rem 1rem;
            background: rgba(10, 77, 60, 0.08);
            border: 1px solid var(--primary);
            border-radius: 8px;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
        }
        .login-hint strong { color: var(--accent); font-family: var(--code-font); }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-wrapper .form-input {
            width: 100%;
            padding-right: 2.8rem;
        }
        .toggle-senha {
            position: absolute;
            right: 0.75rem;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            padding: 0;
            display: flex;
            align-items: center;
            transition: color 0.2s;
        }
        .toggle-senha:hover { color: var(--text-primary); }
        .toggle-senha svg { width: 18px; height: 18px; }
    </style>
</head>
<body>
    <div class="login-page">

        <!-- ── Formulário ────────────────────────────────── -->
        <div class="login-form-panel">
            <div class="login-logo-area">
                <img id="logoImg" src="assets/logo_escura.png" alt="CEQUI">
                <div class="system-sub">Programa de Resultados</div>
            </div>

            <form id="loginForm" autocomplete="off" style="flex:1;display:flex;flex-direction:column;gap:0;">
                <div class="form-group">
                    <label class="form-label">Número do Ponto</label>
                    <input type="text" class="form-input" id="ponto"
                        placeholder="P_703150" maxlength="11" required autofocus
                        style="letter-spacing:1px;"
                        oninput="this.value=this.value.toUpperCase()">
                    <div style="font-size:0.75rem;color:var(--text-muted);margin-top:0.3rem;">Digite no formato P_<em>número</em> — ex: P_703150</div>
                </div>
                <div class="form-group">
                    <label class="form-label">Senha</label>
                    <div class="password-wrapper">
                        <input type="password" class="form-input" id="senha"
                            placeholder="••••••••" required>
                        <button type="button" class="toggle-senha" onclick="toggleSenha()" id="btnOlho" aria-label="Mostrar/ocultar senha">
                            <svg id="iconeOlho" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-submit" id="loginBtn">
                    Entrar
                </button>

                <div class="login-error" id="loginError"></div>
            </form>

        </div>

    </div>

    <button id="themeToggle" class="theme-toggle" aria-label="Alternar tema"></button>

    <script src="js/mock-data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/api-client.js?v=2"></script>
    <script src="js/theme.js"></script>
    <script src="js/auth.js?v=2"></script>
    <script>
        // Sincronizar logo com tema claro/escuro
        (function syncLogo() {
            function update() {
                var isLight = document.documentElement.getAttribute('data-theme') === 'light';
                document.getElementById('logoImg').src = isLight
                    ? 'assets/logo_clara.png'
                    : 'assets/logo_escura.png';
            }
            document.addEventListener('DOMContentLoaded', function() {
                update();
                new MutationObserver(update).observe(document.documentElement, {
                    attributes: true, attributeFilter: ['data-theme']
                });
            });
        })();

        // Mostrar/ocultar senha
        function toggleSenha() {
            var input = document.getElementById('senha');
            var icone = document.getElementById('iconeOlho');
            var visivel = input.type === 'text';
            input.type = visivel ? 'password' : 'text';
            icone.innerHTML = visivel
                ? '<path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>'
                : '<path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.477 0-8.268-2.943-9.542-7a9.956 9.956 0 012.293-3.95M6.634 6.634A9.956 9.956 0 0112 5c4.477 0 8.268 2.943 9.542 7a9.956 9.956 0 01-4.176 5.166M3 3l18 18"/>';
        }
    </script>
</body>
</html>
